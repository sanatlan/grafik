<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 160" width="100%" height="100%">
    <defs>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e6a23c" />
            <stop offset="50%" stop-color="#e6a23c" />
            <stop offset="100%" stop-color="#e6a23c" />
        </linearGradient>
        
        <!-- Anahtarın Takip Ettiği Hareket Yolu (Yörünge) -->
        <path id="keyPath" d="M -15,15 Q 25,-10 65,15 T 25,40 Z" fill="none"/>
    </defs>

    <style>
        /* Anahtarın ev ve araba arasında gidip gelme (kilit açma) animasyonu */
        .animated-key {
            animation: unlockMotion 3.5s infinite ease-in-out;
            transform-origin: 20px 20px;
        }

        @keyframes unlockMotion {
            0% {
                transform: translate(95px, 45px) rotate(-15deg) scale(1);
            }
            30% {
                transform: translate(115px, 28px) rotate(15deg) scale(1.1); /* Eve doğru yaklaşma / açma hamlesi */
            }
            50% {
                transform: translate(95px, 62px) rotate(-35deg) scale(1);
            }
            75% {
                transform: translate(118px, 72px) rotate(25deg) scale(1.1); /* Arabaya doğru yaklaşma / açma hamlesi */
            }
            100% {
                transform: translate(95px, 45px) rotate(-15deg) scale(1);
            }
        }
    </style>

    <!-- Kalkan Arka Plan -->
    <path d="M 80,15 C 110,15 130,5 140,5 C 150,5 170,15 200,15 C 200,85 140,125 140,145 C 140,125 80,85 80,15 Z" fill="url(#shieldGrad)" stroke="#e6a23c" stroke-width="3"/>
    
    <!-- Ev İkonu -->
    <path d="M 120,42 L 140,25 L 160,42 V 65 H 120 Z" fill="none" stroke="#e8dfd1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Araba İkonu -->
    <path d="M 115,75 H 165 C 168,75 170,78 168,82 L 163,92 H 117 L 112,82 C 110,78 112,75 115,75 Z" fill="#e6a23c"/>
    <circle cx="125" cy="94" r="5" fill="#e8dfd1" stroke="#1e293b" stroke-width="2"/>
    <circle cx="155" cy="94" r="5" fill="#e8dfd1" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Hareket Eden Anahtar İkonu -->
    <g class="animated-key">
        <circle cx="20" cy="20" r="10" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
        <path d="M 28,24 L 55,51 M 48,44 L 53,39 M 52,48 L 57,43" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Yazı Alanı -->
    <text x="215" y="52" fill="#e6a23c" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="24" letter-spacing="1">BAHÇELİEVLER</text>
    <text x="215" y="85" fill="#e8dfd1" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="22" letter-spacing="2">ÇİLİNGİR</text>
    <text x="215" y="115" fill="#e6a23c" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="3">&amp; OTO ANAHTAR</text>
</svg>
