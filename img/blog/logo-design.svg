<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Logo ve marka kimliği tasarımı</title>
  <desc id="desc">Bir logo tasarımının renk, biçim ve tipografi öğeleriyle oluşturulması.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#f8f3e8"/>
      <stop offset="1" stop-color="#e8dcc5"/>
    </linearGradient>
    <linearGradient id="ink" x2="1" y2="1">
      <stop stop-color="#9c7541"/>
      <stop offset="1" stop-color="#5f482c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3b3022" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#paper)"/>
  <circle cx="1010" cy="130" r="180" fill="#d6c29e" opacity=".35"/>
  <circle cx="190" cy="680" r="220" fill="#c9b28a" opacity=".2"/>
  <g filter="url(#shadow)">
    <rect x="145" y="95" width="910" height="570" rx="28" fill="#fffdf8"/>
    <rect x="145" y="95" width="910" height="15" rx="7" fill="#8f6b3e"/>
    <circle cx="190" cy="145" r="8" fill="#d8c9ae"/>
    <circle cx="220" cy="145" r="8" fill="#d8c9ae"/>
    <circle cx="250" cy="145" r="8" fill="#d8c9ae"/>
    <g transform="translate(265 220)">
      <circle cx="190" cy="165" r="142" fill="#f2eadb"/>
      <path d="M91 237 190 63l99 174h-58l-41-76-42 76z" fill="url(#ink)"/>
      <path d="M163 190h55l-28-50z" fill="#c4a56f"/>
      <circle cx="190" cy="165" r="142" fill="none" stroke="#b79a6c" stroke-width="3"/>
    </g>
    <text x="600" y="340" fill="#28251f" font-family="Georgia,serif" font-size="51" letter-spacing="5">MARKA KİMLİĞİ</text>
    <text x="603" y="390" fill="#85765f" font-family="Arial,sans-serif" font-size="19" letter-spacing="4">LOGO · RENK · TİPOGRAFİ</text>
    <path d="M600 430h300" stroke="#d9c9a9" stroke-width="2"/>
    <g transform="translate(605 473)">
      <circle cx="20" cy="20" r="20" fill="#5f482c"/>
      <circle cx="77" cy="20" r="20" fill="#9c7541"/>
      <circle cx="134" cy="20" r="20" fill="#c4a56f"/>
      <circle cx="191" cy="20" r="20" fill="#e8dcc5"/>
    </g>
  </g>
</svg>
